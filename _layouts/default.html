<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">
    {% seo %}
  </head>
  <body>
    <header>
      <div class="inner">
        <a href="{{ '/' | absolute_url }}">
          <h1>{{ site.title | default: site.github.repository_name }}</h1>
        </a>
        <h2>{{ site.description | default: site.github.project_tagline }}</h2>
        
        <!-- Pulsante GitHub -->
        <a href="https://github.com/giuseppe-maglione" target="_blank" class="button"><small>View profile on</small> GitHub</a>
        
        <!-- Pulsante TryHackMe -->
        <a href="https://tryhackme.com/p/giuu" target="_blank" class="button"><small>View profile on</small> TryHackMe</a>
        
        <!-- Pulsante LinkedIn -->
        <a href="https://www.linkedin.com/in/giuseppe-maglione-48748a23b/" target="_blank" class="button"><small>Connect on</small> LinkedIn</a>
        
      </div>
    </header>
    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          {{ content }}
        </section>
      </div>
    </div>
  </body>
</html>
